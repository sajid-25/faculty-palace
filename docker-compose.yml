services:
  postgres:
    image: postgres:16
    container_name: assessiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: assessiq
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - assessiq-postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

volumes:
  assessiq-postgres-data:
